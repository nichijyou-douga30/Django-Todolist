{% extends "TODOlist/base.html" %}

{% block title %}TODOの削除{% endblock %}

{% block content %}
<h1>このTODOを削除しますか?</h1>
<p class="confirm-dialog-target">{{ todo.Todo_theme }}</p>
<p>削除すると、編集履歴も含めて元に戻せません。</p>
<form method="post">
    {% csrf_token %}
    <div class="actions">
        <a class="btn" href="{% url 'TODOlist:results' todo.id %}">キャンセル</a>
        <button type="submit" class="btn btn-danger">削除する</button>
    </div>
</form>
{% endblock %}
