{% extends "TODOlist/base.html" %}

{% block title %}番号{{ todo.id }}のTODOを編集{% endblock %}

{% block content %}
<h1>番号{{ todo.id }}のTODOを編集</h1>
{% if todo.is_edited %}
<p class="edited-badge">編集済み</p>
{% endif %}
<form action="{% url 'TODOlist:update' todo.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit" class="btn btn-primary">編集を保存</button>
        <a href="{% url 'TODOlist:results' todo.id %}">キャンセル</a>
    </div>
</form>

<h2>編集履歴</h2>
{% include "TODOlist/_edit_history.html" %}
{% endblock %}
