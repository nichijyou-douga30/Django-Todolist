{% extends "TODOlist/base.html" %}

{% block title %}TODOを登録{% endblock %}

{% block content %}
<h1>TODOを登録</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit" class="btn btn-primary">登録する</button>
        <a href="{% url 'TODOlist:todolist' %}">一覧へ戻る</a>
    </div>
</form>
{% endblock %}
